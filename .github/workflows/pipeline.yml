name: CI/CD pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm install
          git diff --exit-code

      - name: Run code auto-formatting
        run: |
          npm run auto-format
          git diff --exit-code

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run tests
        run: npm test
