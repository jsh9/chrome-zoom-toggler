name: Release

# When a release is published, attach a ZIP of the extension that can be
# uploaded to the Chrome Web Store as is. (GitHub's "Source code (zip)" cannot:
# it has the files in a folder, and the store needs manifest.json at the root.)
#
# The workflow can also be run by hand (Actions > Release > Run workflow) for
# a tag. Then, if the tag has no release yet, it creates one, with the notes
# for that version from CHANGELOG.md. If the tag does not exist yet either, it
# is created on the given commit.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the version (e.g., v0.0.8)
        required: true
      commit:
        description: Full hash of the commit to create the tag on, if the tag does not exist yet
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the inputs
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::\"$TAG\" is not a tag like v0.0.8"
            exit 1
          fi
          if [[ -n "$COMMIT" && ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::\"$COMMIT\" is not a full commit hash"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || format('refs/tags/{0}', env.TAG) }}
          # The whole history, to find the previous tag for the release notes
          fetch-depth: 0

      - name: Check that the tag, if it exists, is on the given commit
        if: inputs.commit != ''
        run: |
          tag_commit=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The tag $TAG already exists on another commit ($tag_commit)"
            exit 1
          fi

      - name: Check that the tag matches the version in manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in manifest.json"
            exit 1
          fi

      - name: Package the extension
        # Only the files of the extension: no development files, such as
        # dotfiles (e.g., .github/), tests, npm and Playwright files, or docs
        run: |
          git ls-files \
            | grep -v -E '^(\.|tests/|package(-lock)?\.json$|playwright\.config\.js$|[^/]*\.md$|LICENSE$)' \
            > "$RUNNER_TEMP/files.txt"
          if ! grep -qx manifest.json "$RUNNER_TEMP/files.txt"; then
            echo "::error::manifest.json is not at the root of the ZIP"
            exit 1
          fi
          zip -X "$RUNNER_TEMP/zoom-toggler-$TAG.zip" -@ < "$RUNNER_TEMP/files.txt"
          unzip -l "$RUNNER_TEMP/zoom-toggler-$TAG.zip"

      - name: Create the release if there is none
        if: github.event_name == 'workflow_dispatch'
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists"
            exit 0
          fi

          # The section of CHANGELOG.md for this version, without its heading
          awk -v heading="## [${TAG#v}]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2> /dev/null || true)
          if [ -n "$previous_tag" ]; then
            compare_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous_tag...$TAG"
            printf '\n**Full Changelog**: %s\n' "$compare_url" >> "$RUNNER_TEMP/notes.md"
          fi

          # Also creates the tag on the checked-out commit if it does not exist
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Attach the ZIP to the release
        run: gh release upload "$TAG" "$RUNNER_TEMP/zoom-toggler-$TAG.zip" --clobber
